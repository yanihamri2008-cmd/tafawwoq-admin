<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f7f7fc;--card:#fff;--ink:#1e293b;--mute:#64748b;--line:#e5e7f2;--brand:#4f46e5;--brand-ink:#fff;--gold:#f5b301;--bad:#dc2626;--ok:#059669;--chip:#eef0ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e24;--card:#1a1938;--ink:#e8e9f7;--mute:#9a9cc0;--line:#2b2a52;--brand:#818cf8;--brand-ink:#0f0e24;--gold:#fbbf24;--bad:#f87171;--ok:#34d399;--chip:#26255a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Cairo,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-weight:800}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:36px;height:36px;border-radius:10px}
.bar h1{font-size:18px;flex:1}
nav{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav button{flex:none}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:600 14px Cairo,sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font:700 15px Cairo,sans-serif;padding:11px 18px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:12px;margin-inline-end:6px}
.chip.gold{background:var(--gold);color:#1e1b4b}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.mute{color:var(--mute);font-size:13px}
.acts{display:flex;gap:6px;flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:20;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.codes{font:600 15px ui-monospace,monospace;direction:ltr;text-align:left;white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;user-select:all}
.hint{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.sw{display:flex;align-items:center;gap:8px;margin:10px 0}
.sw input{width:auto}
.login{max-width:420px;margin:12vh auto 0}
.login img{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 12px}
[hidden]{display:none!important}
</style>
</head>

const LEVELS=[['1am','الأولى متوسط'],['2am','الثانية متوسط'],['3am','الثالثة متوسط'],['4am','الرابعة متوسط'],['1as','الأولى ثانوي'],['2as','الثانية ثانوي'],['3as','الثالثة ثانوي']];
const TRACKS=[['common_sci','جذع مشترك علوم'],['common_lit','جذع مشترك آداب'],['sci','علوم تجريبية'],['math','رياضيات'],['techmath','تقني رياضي'],['mgmt','تسيير واقتصاد'],['lit','آداب وفلسفة'],['lang','لغات أجنبية']];
const SUBJECTS=[['arabic','اللغة العربية'],['math','الرياضيات'],['physics','العلوم الفيزيائية'],['natural','علوم الطبيعة والحياة'],['history','التاريخ'],['geography','الجغرافيا'],['islamic','العلوم الإسلامية'],['civics','التربية المدنية'],['french','اللغة الفرنسية'],['english','اللغة الإنجليزية'],['philosophy','الفلسفة'],['technology','التكنولوجيا'],['accounting','المحاسبة والمالية'],['economics','الاقتصاد والمناجمنت'],['law','القانون'],['thirdlang','اللغة الثالثة']];
const nameOf=(list,id)=>(list.find(x=>x[0]===id)||[id,id||'—'])[1];
const opts=(list,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+list.map(([v,n])=>`<option value="${v}" ${v===sel?'selected':''}>${n}</option>`).join('');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let URL_=store.get('url'),PW='',tab='lessons',ui={level:'1am',edit:null};
try{PW=sessionStorage.getItem('pw')||''}catch(e){}

function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2200)}
async function api(action,data={}){
  let r;
  try{r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,admin_password:PW,...data})})}
  catch(e){throw new Error('ما قدرتش نوصل للسيرفر. تأكد من الرابط ومن الإنترنت.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||('خطأ '+r.status));
  return j;
}
async function run(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(e.message,true)}finally{if(btn)btn.disabled=false}}

// ---------- الدروس ----------
async function lessonsView(){
  const m=$('#main');
  if(ui.edit){return lessonForm()}
  m.innerHTML='<p class="mute">جاري التحميل…</p>';
  const [st,ls]=await Promise.all([api('admin_stats'),api('admin_lessons_list',{level:ui.level})]);
  const subj=ui.subject||'';
  const list=ls.lessons.filter(l=>!subj||l.subject===subj);
  m.innerHTML=`<div class="stats"><div class="stat"><b>${st.lessons}</b><span class="mute">درس</span></div><div class="stat"><b>${st.students}</b><span class="mute">تلميذ مدرسة</span></div><div class="stat"><b>${st.subscribers}</b><span class="mute">مشترك بلس</span></div><div class="stat"><b>${st.codes_total-st.codes_used}</b><span class="mute">كود متاح</span></div></div>
  <div class="card"><div class="row"><div><label>المستوى</label><select id="fl">${opts(LEVELS,ui.level)}</select></div><div><label>المادة</label><select id="fs">${opts(SUBJECTS,subj,'كل المواد')}</select></div></div>
  <div style="height:12px"></div><button class="btn" id="new">+ درس جديد</button></div>
  <div class="card">${list.length?list.map(l=>`<div class="item"><div class="t"><b>${esc(l.title)}</b><span class="mute">${nameOf(SUBJECTS,l.subject)}${l.track?' · '+nameOf(TRACKS,l.track):''}</span><br>
  ${l.video_url?'<span class="chip">فيديو</span>':''}${l.school_only?'<span class="chip gold">المدرسة</span>':''}${l.premium?'<span class="chip gold">بلس</span>':''}${l.published?'':'<span class="chip">مسودة</span>'}</div>
  <div class="acts"><button class="btn ghost sm" data-e="${l.id}">تعديل</button><button class="btn bad sm" data-d="${l.id}">حذف</button></div></div>`).join(''):'<p class="mute">ما فيه دروس هنا بعد. اضغط «درس جديد».</p>'}</div>`;
  $('#fl').onchange=e=>{ui.level=e.target.value;lessonsView()};
  $('#fs').onchange=e=>{ui.subject=e.target.value;lessonsView()};
  $('#new').onclick=()=>{ui.edit={level:ui.level,subject:subj||'math',published:true};lessonsView()};
  m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ui.edit=ls.lessons.find(l=>l.id==b.dataset.e);lessonsView()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='تأكيد الحذف؟';setTimeout(()=>{b.dataset.armed='';b.textContent='حذف'},3000);return}
    run(b,async()=>{await api('admin_lesson_delete',{id:+b.dataset.d});toast('تم الحذف');lessonsView()});
  });
}
async function lessonForm(){
  const l=ui.edit,m=$('#main');
  m.innerHTML=`<div class="card"><h3>${l.id?'تعديل الدرس':'درس جديد'}</h3>
  <div class="row"><div><label>المستوى</label><select id="level">${opts(LEVELS,l.level)}</select></div><div><label>المادة</label><select id="subject">${opts(SUBJECTS,l.subject)}</select></div></div>
  <label>الشعبة (اتركها فارغة لو الدرس لكل الشعب)</label><select id="track">${opts(TRACKS,l.track||'','كل الشعب')}</select>
  <label>عنوان الدرس</label><input id="title" value="${esc(l.title)}">
  <label>نص الدرس / الشرح</label><textarea id="body">${esc(l.body)}</textarea>
  <label>رابط الفيديو (يوتيوب أو غيره)</label><input id="video" dir="ltr" placeholder="https://youtu.be/…" value="${esc(l.video_url)}">
  <div class="hint">للدروس الخاصة بالمدرسة: ارفع الفيديو على يوتيوب بوضع «غير مدرج» (Unlisted) وضع الرابط هنا. التلاميذ ما يشوفوا الرابط إلا بعد تسجيل الدخول.</div>
  <div class="sw"><input type="checkbox" id="school" ${l.school_only?'checked':''}><label style="margin:0">خاص بتلاميذ المدرسة (يحتاج تسجيل دخول)</label></div>
  <div class="sw"><input type="checkbox" id="prem" ${l.premium?'checked':''}><label style="margin:0">لمشتركي تفوّق بلس فقط</label></div>
  <div class="sw"><input type="checkbox" id="pub" ${l.published!==false?'checked':''}><label style="margin:0">منشور (أزل العلامة لحفظه كمسودة)</label></div>
  <label>الترتيب (رقم أصغر = أول)</label><input id="sort" type="number" value="${l.sort||0}">
  <div style="height:14px"></div><div class="row"><button class="btn" id="save">حفظ</button><button class="btn ghost" id="cancel">رجوع</button></div></div>`;
  $('#cancel').onclick=()=>{ui.edit=null;lessonsView()};
  $('#save').onclick=e=>run(e.target,async()=>{
    await api('admin_lesson_save',{lesson:{id:l.id,level:$('#level').value,subject:$('#subject').value,track:$('#track').value,title:$('#title').value,body:$('#body').value,video_url:$('#video').value,school_only:$('#school').checked,premium:$('#prem').checked,published:$('#pub').checked,sort:$('#sort').value}});
    ui.level=$('#level').value;ui.edit=null;toast('تم الحفظ ✓');lessonsView();
  });
}

// ---------- حسابات المدرسة ----------
async function studentsView(){
  const m=$('#main');
  if(ui.edit)return studentForm();
  const {students}=await api('admin_students_list');
  m.innerHTML=`<div class="card"><p class="mute" style="margin-top:0">هذي الحسابات تفتح الدروس المخصصة لتلاميذ المدرسة داخل التطبيق.</p><button class="btn" id="new">+ حساب جديد</button></div>
  <div class="card">${students.length?students.map(s=>`<div class="item"><div class="t"><b>${esc(s.name||s.username)}</b><span class="mute" dir="ltr">${esc(s.username)}</span> ${s.active?'':'<span class="chip">موقوف</span>'}</div>
  <div class="acts"><button class="btn ghost sm" data-e="${s.id}">تعديل</button><button class="btn bad sm" data-d="${s.id}">حذف</button></div></div>`).join(''):'<p class="mute">ما فيه حسابات بعد.</p>'}</div>`;
  $('#new').onclick=()=>{ui.edit={active:true};studentsView()};
  m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ui.edit=students.find(s=>s.id==b.dataset.e);studentsView()});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='تأكيد الحذف؟';setTimeout(()=>{b.dataset.armed='';b.textContent='حذف'},3000);return}
    run(b,async()=>{await api('admin_student_delete',{id:+b.dataset.d});toast('تم الحذف');studentsView()});
  });
}
function studentForm(){
  const s=ui.edit,m=$('#main');
  m.innerHTML=`<div class="card"><h3>${s.id?'تعديل الحساب':'حساب جديد'}</h3>
  <label>الاسم</label><input id="name" value="${esc(s.name)}">
  <label>اسم المستخدم (إنجليزي بدون مسافات)</label><input id="user" dir="ltr" value="${esc(s.username)}" ${s.id?'readonly':''}>
  <label>${s.id?'كلمة سر جديدة (اتركها فارغة لو ما تبغى تغيّرها)':'كلمة السر (6 أحرف على الأقل)'}</label><input id="pass" dir="ltr" type="text" autocomplete="off">
  <div class="sw"><input type="checkbox" id="act" ${s.active!==false?'checked':''}><label style="margin:0">الحساب فعّال</label></div>
  <div style="height:10px"></div><div class="row"><button class="btn" id="save">حفظ</button><button class="btn ghost" id="cancel">رجوع</button></div></div>`;
  $('#cancel').onclick=()=>{ui.edit=null;studentsView()};
  $('#save').onclick=e=>run(e.target,async()=>{
    await api('admin_student_save',{student:{id:s.id,name:$('#name').value,username:$('#user').value,password:$('#pass').value,active:$('#act').checked}});
    ui.edit=null;toast('تم الحفظ ✓');studentsView();
  });
}

// ---------- الأكواد ----------
async function codesView(){
  const m=$('#main');
  const {codes}=await api('admin_codes_list');
  m.innerHTML=`<div class="card"><h3>توليد أكواد اشتراك</h3><div class="row"><div><label>العدد</label><input id="n" type="number" value="5" min="1" max="100"></div><div><label>المدة (أيام)</label><input id="d" type="number" value="30" min="1" max="365"></div></div>
  <label>ملاحظة (مثلاً: اسم من اشترى)</label><input id="note"><div style="height:12px"></div><button class="btn" id="gen">توليد</button><div id="out" style="margin-top:12px"></div></div>
  <div class="card"><h3 style="margin-bottom:6px">آخر الأكواد</h3>${codes.length?codes.map(c=>`<div class="item"><div class="t"><b dir="ltr" style="text-align:right">${esc(c.code)}</b><span class="mute">${c.days} يوم${c.note?' · '+esc(c.note):''}</span></div>${c.redeemed_at?'<span class="chip">مستعمل</span>':'<span class="chip gold">متاح</span>'}</div>`).join(''):'<p class="mute">ما فيه أكواد.</p>'}</div>`;
  $('#gen').onclick=e=>run(e.target,async()=>{
    const r=await api('admin_codes_create',{count:+$('#n').value,days:+$('#d').value,note:$('#note').value});
    const txt=r.codes.join('\n');
    $('#out').innerHTML=`<div class="codes">${esc(txt)}</div><div style="height:8px"></div><button class="btn ghost sm" id="cp">نسخ الكل</button>`;
    $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('تم النسخ ✓')}catch(e){const r=document.createRange();r.selectNodeContents($('.codes'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('حدّد النص وانسخه يدوياً')}};
  });
}

// ---------- الإعلانات ----------
async function newsView(){
  const m=$('#main');
  const {announcements}=await api('admin_ann_list');
  m.innerHTML=`<div class="card"><h3>إعلان جديد</h3><p class="mute" style="margin-top:0">يظهر لكل مستخدمي التطبيق.</p><label>العنوان</label><input id="t"><label>النص</label><textarea id="b" style="min-height:90px"></textarea><div style="height:12px"></div><button class="btn" id="add">نشر الإعلان</button></div>
  <div class="card">${announcements.length?announcements.map(a=>`<div class="item"><div class="t"><b>${esc(a.title)}</b><span class="mute">${esc(a.body||'')}</span></div><div class="acts"><button class="btn ghost sm" data-t="${a.id}">${a.active?'إخفاء':'إظهار'}</button><button class="btn bad sm" data-d="${a.id}">حذف</button></div></div>`).join(''):'<p class="mute">ما فيه إعلانات.</p>'}</div>`;
  $('#add').onclick=e=>run(e.target,async()=>{await api('admin_ann_save',{announcement:{title:$('#t').value,body:$('#b').value}});toast('تم النشر ✓');newsView()});
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>run(b,async()=>{const a=announcements.find(x=>x.id==b.dataset.t);await api('admin_ann_save',{announcement:{id:a.id,title:a.title,body:a.body,active:!a.active}});newsView()}));
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.armed='';b.textContent='حذف'},3000);return}
    run(b,async()=>{await api('admin_ann_delete',{id:+b.dataset.d});newsView()});
  });
}

// ---------- الإعدادات ----------
async function settingsView(){
  const {settings:s}=await api('admin_settings_get');
  const f=(k,l,ph='',area)=>`<label>${l}</label>${area?`<textarea data-k="${k}" style="min-height:80px">${esc(s[k])}</textarea>`:`<input data-k="${k}" placeholder="${ph}" value="${esc(s[k])}">`}`;
  $('#main').innerHTML=`<div class="card"><h3>المطوّر</h3>${f('developer_name','الاسم')}${f('developer_role','الصفة','مطوّر التطبيق')}${f('developer_bio','نبذة','',1)}</div>
  <div class="card"><h3>المدرسة الشريكة</h3>${f('school_name','اسم المدرسة')}${f('school_blurb','نبذة عن الشراكة','',1)}</div>
  <div class="card"><h3>تحديث التطبيق</h3><p class="mute" style="margin-top:0">لما تبني نسخة جديدة، ارفع الـ APK (مثلاً في GitHub Releases) وحط رابطه هنا. التطبيق يعلم المستخدمين بالتحديث.</p>
  ${f('latest_version','رقم آخر نسخة','0.2.0')}<label>رابط تحميل الـ APK</label><input dir="ltr" data-k="apk_url" value="${esc(s.apk_url)}" placeholder="https://github.com/…/releases/download/…/app-release.apk">${f('update_notes','ما الجديد؟','',1)}
  <div class="sw"><input type="checkbox" data-k="force_update" ${s.force_update==='1'?'checked':''}><label style="margin:0">تحديث إجباري (يمنع استعمال النسخ القديمة)</label></div></div>
  <button class="btn" id="save" style="width:100%">حفظ الإعدادات</button>`;
  $('#save').onclick=e=>run(e.target,async()=>{
    const o={};document.querySelectorAll('[data-k]').forEach(el=>{o[el.dataset.k]=el.type==='checkbox'?(el.checked?'1':'0'):el.value});
    await api('admin_settings_set',{settings:o});toast('تم الحفظ ✓');
  });
}

if(URL_&&PW){api('admin_check').then(shell).catch(loginView)}else loginView();
